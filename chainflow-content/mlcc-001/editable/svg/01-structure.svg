<path d="M70 92 H1010" stroke="#C7CED2" stroke-width="1.5"/>
<text x="70" y="62" class="caption" font-weight="600" style="fill:#102B4E"><tspan x="70" dy="0">链流品类志  /  CF Components 001</tspan></text>
<text x="1010" y="62" class="caption" text-anchor="end" font-weight="700" style="fill:#102B4E"><tspan x="1010" dy="0">01 / 09</tspan></text>
<text x="70" y="170" class="title"><tspan x="70" dy="0">一颗MLCC内部，不是一片电容</tspan></text>
<text x="72" y="218" class="subtitle"><tspan x="72" dy="0">交错内电极与陶瓷介质层，把许多微型电容并联到两个端头</tspan></text>

