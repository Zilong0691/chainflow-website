<g>
  <path d="M300 344 L356 415" class="line"/>
  <circle cx="300" cy="344" r="5" fill="#102B4E"/>
  <text x="125" y="332" class="caption" font-weight="700" style="fill:#102B4E"><tspan x="125" dy="0">陶瓷介质层</tspan><tspan x="125" dy="28">隔开相邻电极，决定介电性能</tspan></text>
</g>
<g>
  <path d="M760 325 L705 444" class="line"/>
  <circle cx="760" cy="325" r="5" fill="#102B4E"/>
  <text x="775" y="318" class="caption" font-weight="700" style="fill:#102B4E"><tspan x="775" dy="0">内电极</tspan><tspan x="775" dy="28">交错伸向左右端头</tspan></text>
</g>
<g>
  <path d="M139 838 L154 775" class="line"/>
  <circle cx="139" cy="838" r="5" fill="#102B4E"/>
  <text x="115" y="878" class="caption" font-weight="700" style="fill:#102B4E"><tspan x="115" dy="0">端电极</tspan><tspan x="115" dy="28">把奇偶层分别引出</tspan></text>
</g>
<g>
  <path d="M930 850 L910 775" class="line"/>
  <circle cx="930" cy="850" r="5" fill="#102B4E"/>
  <text x="742" y="878" class="caption" font-weight="700" style="fill:#102B4E"><tspan x="742" dy="0">Ni / Sn 电镀</tspan><tspan x="742" dy="28">改善阻挡层与焊接界面</tspan></text>
</g>

<rect x="95" y="940" width="890" height="220" rx="8" fill="#FFFFFF" opacity="0.62" stroke="#C7CED2"/>
<text x="126" y="990" class="label"><tspan x="126" dy="0">结构逻辑</tspan></text>
<text x="126" y="1040" class="body"><tspan x="126" dy="0">每两片相邻内电极之间形成一个电容单元。</tspan><tspan x="126" dy="35">交错端头把许多单元等效并联。</tspan><tspan x="126" dy="35">容量随有效面积、介电常数和层数增加。</tspan></text>
<rect x="655" y="1018" width="285" height="76" rx="8" fill="#102B4E"/>
<text x="797" y="1063" class="caption" text-anchor="middle" font-weight="700" style="fill:#F6F0E6"><tspan x="797" dy="0">C_total ≈ n × εrε0A / d</tspan></text>
<text x="126" y="1148" class="caption" style="fill:#B33A3A"><tspan x="126" dy="0">边界：Ni 内电极和端接材料随厂商、系列和应用等级变化，本图表达通用连接逻辑。</tspan></text>

<path d="M70 1322 H1010" stroke="#C7CED2" stroke-width="1.5"/>
<text x="70" y="1353" class="caption" font-weight="700" style="fill:#102B4E"><tspan x="70" dy="0">ChainFlow 判断</tspan></text>
<text x="192" y="1353" class="caption" style="fill:#1B1F24"><tspan x="192" dy="0">看懂端头连接，才看得懂为什么同样封装也会有不同性能边界。</tspan></text>
<text x="70" y="1385" class="mini"><tspan x="70" dy="0">事实来源：MLCC-F001/F002/F009；结构为通用示意，非特定厂商型号。</tspan></text>
</svg>
