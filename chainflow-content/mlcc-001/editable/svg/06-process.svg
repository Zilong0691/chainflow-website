<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
<defs>
  <linearGradient id="softEdge" x1="0" x2="1">
    <stop offset="0" stop-color="#F6F0E6"/>
    <stop offset="1" stop-color="#EFE5D6"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#102B4E" flood-opacity="0.10"/>
  </filter>
</defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",Arial,sans-serif}
  .serif{font-family:"Songti SC","Noto Serif CJK SC","STSong",SimSun,serif}
  text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#1B1F24;letter-spacing:0}
  .title{font-family:"Songti SC","Noto Serif CJK SC","STSong",SimSun,serif;font-size:70px;font-weight:700}
  .subtitle{font-size:27px;font-weight:500;fill:#41505D}
  .body{font-size:24px;fill:#1B1F24}
  .caption{font-size:17px;fill:#65717D}
  .label{font-size:21px;font-weight:650;fill:#102B4E}
  .mini{font-size:15px;fill:#65717D}
  .num{font-size:18px;font-weight:700;fill:#102B4E}
  .line{stroke:#C7CED2;stroke-width:2;fill:none}
  .navy{fill:#102B4E}
  .red{fill:#B33A3A}
</style>
<rect width="1080" height="1440" fill="#F6F0E6"/>
<path d="M0 0 H1080 V1440 H0 Z" fill="url(#softEdge)" opacity="0.55"/>
<path d="M70 92 H1010" stroke="#C7CED2" stroke-width="1.5"/>
<text x="70" y="62" class="caption" font-weight="600" style="fill:#102B4E"><tspan x="70" dy="0">链流品类志  /  CF Components 001</tspan></text>
<text x="1010" y="62" class="caption" text-anchor="end" font-weight="700" style="fill:#102B4E"><tspan x="1010" dy="0">06 / 09</tspan></text>
<text x="70" y="170" class="title"><tspan x="70" dy="0">很多层，如何稳定做成一颗</tspan></text>
<text x="72" y="218" class="subtitle"><tspan x="72" dy="0">薄膜、印刷、叠层、共烧和分选，把材料能力变成规模化良率</tspan></text>

<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#246A93"/>
  </marker>
</defs>
<text x="72" y="286" class="label"><tspan x="72" dy="0">通用制造流程</tspan></text>
<g>
  <rect x="80" y="340" width="270" height="132" rx="8" fill="#FFFFFF" opacity="0.72" stroke="#C7CED2"/>
  <circle cx="116" cy="378" r="22" fill="#102B4E"/>
  <text x="116" y="386" class="caption" text-anchor="middle" font-weight="800" style="fill:#F6F0E6"><tspan x="116" dy="0">01</tspan></text>
  <text x="152" y="383" class="label"><tspan x="152" dy="0">粉体与浆料</tspan></text>
  <text x="104" y="428" class="caption"><tspan x="104" dy="0">粉体、添加剂、溶剂和粘结剂形成稳</tspan><tspan x="104" dy="25">定浆料</tspan></text>
  <path d="M360 406 H394" stroke="#246A93" stroke-width="3" marker-end="url(#arr)"/>
</g><g>
  <rect x="395" y="340" width="270" height="132" rx="8" fill="#FFFFFF" opacity="0.72" stroke="#C7CED2"/>
  <circle cx="431" cy="378" r="22" fill="#102B4E"/>
  <text x="431" y="386" class="caption" text-anchor="middle" font-weight="800" style="fill:#F6F0E6"><tspan x="431" dy="0">02</tspan></text>
  <text x="467" y="383" class="label"><tspan x="467" dy="0">流延成膜</tspan></text>
  <text x="419" y="428" class="caption"><tspan x="419" dy="0">把浆料形成薄而均匀的陶瓷绿片</tspan><tspan x="419" dy="25"></tspan></text>
  <path d="M675 406 H709" stroke="#246A93" stroke-width="3" marker-end="url(#arr)"/>
</g><g>
  <rect x="710" y="340" width="270" height="132" rx="8" fill="#FFFFFF" opacity="0.72" stroke="#C7CED2"/>
  <circle cx="746" cy="378" r="22" fill="#102B4E"/>
  <text x="746" y="386" class="caption" text-anchor="middle" font-weight="800" style="fill:#F6F0E6"><tspan x="746" dy="0">03</tspan></text>
  <text x="782" y="383" class="label"><tspan x="782" dy="0">内电极印刷</tspan></text>
  <text x="734" y="428" class="caption"><tspan x="734" dy="0">在绿片上印刷交错内电极图案</tspan><tspan x="734" dy="25"></tspan></text>
  
</g><g>
  <rect x="80" y="528" width="270" height="132" rx="8" fill="#FFFFFF" opacity="0.72" stroke="#C7CED2"/>
  <circle cx="116" cy="566" r="22" fill="#102B4E"/>
  <text x="116" y="574" class="caption" text-anchor="middle" font-weight="800" style="fill:#F6F0E6"><tspan x="116" dy="0">04</tspan></text>
  <text x="152" y="571" class="label"><tspan x="152" dy="0">叠层</tspan></text>
  <text x="104" y="616" class="caption"><tspan x="104" dy="0">按电极方向交替堆叠并保持对位</tspan><tspan x="104" dy="25"></tspan></text>
  <path d="M360 594 H394" stroke="#246A93" stroke-width="3" marker-end="url(#arr)"/>
</g><g>
  <rect x="395" y="528" width="270" height="132" rx="8" fill="#FFFFFF" opacity="0.72" stroke="#C7CED2"/>
  <circle cx="431" cy="566" r="22" fill="#102B4E"/>
  <text x="431" y="574" class="caption" text-anchor="middle" font-weight="800" style="fill:#F6F0E6"><tspan x="431" dy="0">05</tspan></text>
  <text x="467" y="571" class="label"><tspan x="467" dy="0">压合</tspan></text>
  <text x="419" y="616" class="caption"><tspan x="419" dy="0">把多层绿片压成整体胚体</tspan><tspan x="419" dy="25"></tspan></text>
  <path d="M675 594 H709" stroke="#246A93" stroke-width="3" marker-end="url(#arr)"/>
</g><g>
  <rect x="710" y="528" width="270" height="132" rx="8" fill="#FFFFFF" opacity="0.72" stroke="#C7CED2"/>
  <circle cx="746" cy="566" r="22" fill="#102B4E"/>
  <text x="746" y="574" class="caption" text-anchor="middle" font-weight="800" style="fill:#F6F0E6"><tspan x="746" dy="0">06</tspan></text>
  <text x="782" y="571" class="label"><tspan x="782" dy="0">切割</tspan></text>
  <text x="734" y="616" class="caption"><tspan x="734" dy="0">切成单颗芯片尺寸</tspan><tspan x="734" dy="25"></tspan></text>
  
</g><g>
  <rect x="80" y="716" width="270" height="132" rx="8" fill="#FFFFFF" opacity="0.72" stroke="#C7CED2"/>
  <circle cx="116" cy="754" r="22" fill="#102B4E"/>
  <text x="116" y="762" class="caption" text-anchor="middle" font-weight="800" style="fill:#F6F0E6"><tspan x="116" dy="0">07</tspan></text>
  <text x="152" y="759" class="label"><tspan x="152" dy="0">排胶</tspan></text>
  <text x="104" y="804" class="caption"><tspan x="104" dy="0">去除有机物，避免烧结缺陷</tspan><tspan x="104" dy="25"></tspan></text>
  <path d="M360 782 H394" stroke="#246A93" stroke-width="3" marker-end="url(#arr)"/>
</g><g>
  <rect x="395" y="716" width="270" height="132" rx="8" fill="#FFFFFF" opacity="0.72" stroke="#C7CED2"/>
  <circle cx="431" cy="754" r="22" fill="#102B4E"/>
  <text x="431" y="762" class="caption" text-anchor="middle" font-weight="800" style="fill:#F6F0E6"><tspan x="431" dy="0">08</tspan></text>
  <text x="467" y="759" class="label"><tspan x="467" dy="0">烧结/共烧</tspan></text>
  <text x="419" y="804" class="caption"><tspan x="419" dy="0">陶瓷与内电极共同致密化</tspan><tspan x="419" dy="25"></tspan></text>
  <path d="M675 782 H709" stroke="#246A93" stroke-width="3" marker-end="url(#arr)"/>
</g><g>
  <rect x="710" y="716" width="270" height="132" rx="8" fill="#FFFFFF" opacity="0.72" stroke="#C7CED2"/>
  <circle cx="746" cy="754" r="22" fill="#102B4E"/>
  <text x="746" y="762" class="caption" text-anchor="middle" font-weight="800" style="fill:#F6F0E6"><tspan x="746" dy="0">09</tspan></text>
  <text x="782" y="759" class="label"><tspan x="782" dy="0">端接</tspan></text>
  <text x="734" y="804" class="caption"><tspan x="734" dy="0">形成两端电连接与机械接口</tspan><tspan x="734" dy="25"></tspan></text>
  
</g><g>
  <rect x="80" y="904" width="270" height="132" rx="8" fill="#FFFFFF" opacity="0.72" stroke="#C7CED2"/>
  <circle cx="116" cy="942" r="22" fill="#102B4E"/>
  <text x="116" y="950" class="caption" text-anchor="middle" font-weight="800" style="fill:#F6F0E6"><tspan x="116" dy="0">10</tspan></text>
  <text x="152" y="947" class="label"><tspan x="152" dy="0">电镀</tspan></text>
  <text x="104" y="992" class="caption"><tspan x="104" dy="0">形成阻挡层和可焊表面</tspan><tspan x="104" dy="25"></tspan></text>
  <path d="M360 970 H394" stroke="#246A93" stroke-width="3" marker-end="url(#arr)"/>
</g><g>
  <rect x="395" y="904" width="270" height="132" rx="8" fill="#FFFFFF" opacity="0.72" stroke="#C7CED2"/>
  <circle cx="431" cy="942" r="22" fill="#102B4E"/>
  <text x="431" y="950" class="caption" text-anchor="middle" font-weight="800" style="fill:#F6F0E6"><tspan x="431" dy="0">11</tspan></text>
  <text x="467" y="947" class="label"><tspan x="467" dy="0">测试分选</tspan></text>
  <text x="419" y="992" class="caption"><tspan x="419" dy="0">按容量、耐压、损耗与外观分级</tspan><tspan x="419" dy="25"></tspan></text>
  
</g>
<path d="M920 472 V528 H174 V528" stroke="#246A93" stroke-width="3" fill="none" marker-end="url(#arr)" opacity="0.75"/>
<path d="M920 660 V716 H174 V716" stroke="#246A93" stroke-width="3" fill="none" marker-end="url(#arr)" opacity="0.75"/>
<path d="M920 848 V904 H174 V904" stroke="#246A93" stroke-width="3" fill="none" marker-end="url(#arr)" opacity="0.75"/>

<rect x="70" y="1115" width="940" height="148" rx="8" fill="#102B4E"/>
<text x="102" y="1160" class="caption" font-weight="700" style="fill:#F6F0E6"><tspan x="102" dy="0">关键控制点</tspan></text>
<g><rect x="102" y="1185" width="150" height="46" rx="8" fill="#F6F0E6" opacity="0.95"/><text x="177" y="1215" class="caption" text-anchor="middle" font-weight="700" style="fill:#102B4E"><tspan x="177" dy="0">薄层均匀性</tspan></text></g><g><rect x="279" y="1185" width="150" height="46" rx="8" fill="#F6F0E6" opacity="0.95"/><text x="354" y="1215" class="caption" text-anchor="middle" font-weight="700" style="fill:#102B4E"><tspan x="354" dy="0">印刷对位</tspan></text></g><g><rect x="456" y="1185" width="150" height="46" rx="8" fill="#F6F0E6" opacity="0.95"/><text x="531" y="1215" class="caption" text-anchor="middle" font-weight="700" style="fill:#102B4E"><tspan x="531" dy="0">共烧收缩一致</tspan></text></g><g><rect x="633" y="1185" width="150" height="46" rx="8" fill="#F6F0E6" opacity="0.95"/><text x="708" y="1215" class="caption" text-anchor="middle" font-weight="700" style="fill:#102B4E"><tspan x="708" dy="0">缺陷控制</tspan></text></g><g><rect x="810" y="1185" width="150" height="46" rx="8" fill="#F6F0E6" opacity="0.95"/><text x="885" y="1215" class="caption" text-anchor="middle" font-weight="700" style="fill:#102B4E"><tspan x="885" dy="0">测试分选</tspan></text></g>
<text x="102" y="1280" class="caption" font-weight="700" style="fill:#B33A3A"><tspan x="102" dy="0">供应链含义：任何一个环节失控，都会变成良率、可靠性或交付稳定性问题。</tspan></text>

<path d="M70 1322 H1010" stroke="#C7CED2" stroke-width="1.5"/>
<text x="70" y="1353" class="caption" font-weight="700" style="fill:#102B4E"><tspan x="70" dy="0">ChainFlow 判断</tspan></text>
<text x="192" y="1353" class="caption" style="fill:#1B1F24"><tspan x="192" dy="0">材料是上限，工艺把上限变成良率。</tspan></text>
<text x="70" y="1385" class="mini"><tspan x="70" dy="0">事实来源：MLCC-F010/F012；流程为通用示意，不含未核验层数、厚度或良率。</tspan></text>
</svg>
