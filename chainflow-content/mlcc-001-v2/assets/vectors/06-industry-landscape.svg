<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <!--
  ============================================================
  ChainFlow MLCC 001 — 06 产业格局「漏斗 + 认证锁」
  设计日期：2026-06-10

  图层结构（Figma 导入后按此分组）：
  01_Background
  02_Brand-Header
  03_Title-Group
  04_Concentration-Funnel（上半：产业链集中度漏斗）
  05_Qualification-Lock（下半：认证锁定时间轴）
  06_Key-Insight（关键洞察）
  07_Footer
  ============================================================
  -->

  <style>
    text { font-family: 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; letter-spacing: 0; }
  </style>

  <!-- ============================================================
  01_Background
  ============================================================ -->
  <rect width="1080" height="1440" fill="#F4F0E8"/>

  <!-- ============================================================
  02_Brand-Header
  ============================================================ -->
  <g id="Brand-Header">
    <line x1="70" y1="92" x2="1010" y2="92" stroke="#C5CDD4" stroke-width="1.5"/>
    <text x="70" y="65" font-size="15" font-weight="600" fill="#1E3A5F">
      <tspan x="70" dy="0">链流品类志 / CF Components 001</tspan>
    </text>
    <text x="1010" y="65" font-size="15" font-weight="700" fill="#1E3A5F" text-anchor="end">
      <tspan x="1010" dy="0">06 / 09</tspan>
    </text>
  </g>

  <!-- ============================================================
  03_Title-Group
  ============================================================ -->
  <g id="Title-Group">
    <text x="70" y="170" font-family="'Songti SC','Noto Serif CJK SC','STSong',SimSun,serif" font-size="54" font-weight="700" fill="#1A1D22" letter-spacing="2">
      <tspan x="70" dy="0">控制 MLCC 的，不只是成品厂</tspan>
    </text>
    <text x="72" y="218" font-size="22" font-weight="500" fill="#6B7B8D">
      <tspan x="72" dy="0">越是上游，越集中。越是高端，越难进。供应链的关键卡点，往往不在第一眼能看见的地方。</tspan>
    </text>
  </g>

  <!-- ============================================================
  04_Concentration-Funnel — 产业链集中度漏斗
  从上到下（上游→下游），从窄到宽（集中→分散）
  ============================================================ -->
  <g id="Concentration-Funnel" transform="translate(70, 290)">

    <!-- 标题 -->
    <text x="0" y="0" font-size="20" font-weight="700" fill="#1E3A5F">
      <tspan x="0" dy="0">产业链集中度漏斗</tspan>
    </text>
    <text x="200" y="0" font-size="16" fill="#6B7B8D">
      <tspan x="200" dy="0">越往上，供应商越少，控制力越集中</tspan>
    </text>

    <!-- ===== 漏斗底层：下游应用（最宽——高度分散） ===== -->
    <g transform="translate(0, 30)">
      <!-- 漏斗下半部（用梯形表示宽度变化） -->
      <path d="M30,0 L910,0 L810,280 L130,280 Z" fill="#FFFFFF" fill-opacity="0.4" stroke="#C5CDD4" stroke-width="1"/>

      <!-- 下游应用：消费电子 -->
      <rect x="100" y="50" width="780" height="44" rx="5" fill="#FFFFFF" fill-opacity="0.8" stroke="#C5CDD4" stroke-width="1"/>
      <text x="490" y="78" font-size="18" fill="#1A1D22" text-anchor="middle">
        <tspan x="490" dy="0">下游应用：智能手机 · PC · IoT · 家电 · 可穿戴</tspan>
      </text>
      <text x="860" y="78" font-size="14" fill="#6B7B8D" text-anchor="end">
        <tspan x="860" dy="0">极分散</tspan>
      </text>

      <!-- 下游应用：汽车 -->
      <rect x="70" y="104" width="800" height="44" rx="5" fill="#FFFFFF" fill-opacity="0.8" stroke="#C5CDD4" stroke-width="1"/>
      <text x="470" y="132" font-size="18" fill="#1A1D22" text-anchor="middle">
        <tspan x="470" dy="0">下游应用：汽车电子 · AI 服务器 · 工业电源 · 通信基站</tspan>
      </text>
      <text x="830" y="132" font-size="14" fill="#6B7B8D" text-anchor="end">
        <tspan x="830" dy="0">分散</tspan>
      </text>

      <!-- 分销渠道 -->
      <rect x="120" y="158" width="700" height="44" rx="5" fill="#FFFFFF" fill-opacity="0.8" stroke="#C5CDD4" stroke-width="1"/>
      <text x="470" y="186" font-size="18" fill="#1A1D22" text-anchor="middle">
        <tspan x="470" dy="0">分销渠道：授权代理商 · 目录分销商 · 独立现货市场</tspan>
      </text>
      <text x="780" y="186" font-size="14" fill="#6B7B8D" text-anchor="end">
        <tspan x="780" dy="0">中等集中</tspan>
      </text>

      <!-- 中游制造 -->
      <rect x="160" y="212" width="620" height="44" rx="5" fill="#FFFFFF" fill-opacity="0.8" stroke="#C5CDD4" stroke-width="1"/>
      <text x="470" y="240" font-size="18" fill="#1A1D22" text-anchor="middle">
        <tspan x="470" dy="0">中游制造：村田 / 三星电机 / 太阳诱电 / TDK / 国巨 / 华新科 / 风华高科</tspan>
      </text>
      <text x="740" y="240" font-size="14" fill="#C0392B" text-anchor="end">
        <tspan x="740" dy="0">高集中 ▸ 日韩台主导</tspan>
      </text>
    </g>

    <!-- ===== 漏斗上层：上游材料（最窄——高度集中） ===== -->
    <g transform="translate(0, 330)">
      <!-- 上半漏斗 -->
      <path d="M200,0 L740,0 L810,40 L130,40 Z" fill="#1E3A5F" fill-opacity="0.06" stroke="#1E3A5F" stroke-width="1" stroke-opacity="0.3"/>

      <!-- 陶瓷粉体 -->
      <rect x="220" y="10" width="500" height="44" rx="5" fill="#1E3A5F" fill-opacity="0.12" stroke="#1E3A5F" stroke-width="1.5" stroke-opacity="0.3"/>
      <text x="470" y="38" font-size="18" font-weight="600" fill="#1A1D22" text-anchor="middle">
        <tspan x="470" dy="0">陶瓷粉体：堺化学 · 国瓷材料 · Ferro · 日本化学 · 富士钛</tspan>
      </text>
      <text x="680" y="38" font-size="14" fill="#C0392B" text-anchor="end" font-weight="600">
        <tspan x="680" dy="0">极高集中 ▸ 日系 Top5~80%</tspan>
      </text>

      <!-- 金属浆料 + 设备 -->
      <rect x="250" y="64" width="440" height="44" rx="5" fill="#FFFFFF" fill-opacity="0.7" stroke="#C5CDD4" stroke-width="1"/>
      <text x="470" y="92" font-size="17" fill="#1A1D22" text-anchor="middle">
        <tspan x="470" dy="0">金属粉浆料 · 流延机 · 叠层机 · 测试分选设备</tspan>
      </text>
      <text x="650" y="92" font-size="14" fill="#C0392B" text-anchor="end">
        <tspan x="650" dy="0">高集中 ▸ 日系主导</tspan>
      </text>
    </g>

    <!-- 漏斗旁边的风险标注 -->
    <g transform="translate(0, 30)">
      <!-- 左侧标注 -->
      <text x="-5" y="275" font-size="15" fill="#C0392B" font-weight="600">
        <tspan x="-5" dy="0">◀ 控制力高峰</tspan>
      </text>
      <line x1="25" y1="275" x2="150" y2="260" stroke="#C0392B" stroke-width="1.5"/>

      <text x="-5" y="360" font-size="15" fill="#6B7B8D" font-weight="500">
        <tspan x="-5" dy="0">供应风险 ↕</tspan>
      </text>
      <text x="-5" y="380" font-size="15" fill="#6B7B8D" font-weight="500">
        <tspan x="-5" dy="0">替代弹性 ↕</tspan>
      </text>
    </g>

  </g>

  <!-- ============================================================
  05_Qualification-Lock — 认证锁定时间轴
  ============================================================ -->
  <g id="Qualification-Lock" transform="translate(70, 750)">

    <text x="0" y="0" font-size="20" font-weight="700" fill="#1E3A5F">
      <tspan x="0" dy="0">认证锁定：一旦进入，就很难被替代</tspan>
    </text>

    <!-- 时间轴主线 -->
    <line x1="0" y1="60" x2="940" y2="60" stroke="#C5CDD4" stroke-width="2"/>

    <!-- 消费电子路径（上方） -->
    <text x="0" y="40" font-size="15" font-weight="600" fill="#2C6280">
      <tspan x="0" dy="0">消费电子</tspan>
    </text>
    <line x1="0" y1="55" x2="400" y2="55" stroke="#2C6280" stroke-width="3"/>

    <g transform="translate(0, 0)">
      <circle cx="0" cy="60" r="6" fill="#2C6280"/>
      <text x="0" y="90" font-size="14" fill="#1A1D22" text-anchor="middle">
        <tspan x="0" dy="0">参数筛选</tspan>
      </text>
      <text x="0" y="108" font-size="12" fill="#6B7B8D" text-anchor="middle">
        <tspan x="0" dy="0">数天</tspan>
      </text>
    </g>
    <g transform="translate(140, 0)">
      <circle cx="0" cy="60" r="6" fill="#2C6280"/>
      <text x="0" y="90" font-size="14" fill="#1A1D22" text-anchor="middle">
        <tspan x="0" dy="0">工程验证</tspan>
      </text>
      <text x="0" y="108" font-size="12" fill="#6B7B8D" text-anchor="middle">
        <tspan x="0" dy="0">数周</tspan>
      </text>
    </g>
    <g transform="translate(280, 0)">
      <circle cx="0" cy="60" r="6" fill="#2C6280"/>
      <text x="0" y="90" font-size="14" fill="#1A1D22" text-anchor="middle">
        <tspan x="0" dy="0">供应确认</tspan>
      </text>
      <text x="0" y="108" font-size="12" fill="#6B7B8D" text-anchor="middle">
        <tspan x="0" dy="0">数周</tspan>
      </text>
    </g>
    <g transform="translate(400, 0)">
      <circle cx="0" cy="60" r="8" fill="#5D7845"/>
      <text x="0" y="90" font-size="14" fill="#1A1D22" text-anchor="middle" font-weight="700">
        <tspan x="0" dy="0">可替代</tspan>
      </text>
      <text x="0" y="108" font-size="12" fill="#6B7B8D" text-anchor="middle">
        <tspan x="0" dy="0">~1-3 个月</tspan>
      </text>
    </g>

    <!-- 车规路径（下方） -->
    <text x="0" y="130" font-size="15" font-weight="600" fill="#C0392B">
      <tspan x="0" dy="0">车规级</tspan>
    </text>
    <line x1="0" y1="65" x2="940" y2="65" stroke="#C0392B" stroke-width="3"/>

    <g transform="translate(0, 30)">
      <circle cx="0" cy="60" r="6" fill="#C0392B"/>
      <text x="0" y="90" font-size="14" fill="#1A1D22" text-anchor="middle">
        <tspan x="0" dy="0">AEC-Q200</tspan>
      </text>
      <text x="0" y="108" font-size="12" fill="#6B7B8D" text-anchor="middle">
        <tspan x="0" dy="0">应力测试</tspan>
      </text>
    </g>
    <g transform="translate(180, 30)">
      <circle cx="0" cy="60" r="6" fill="#C0392B"/>
      <text x="0" y="90" font-size="14" fill="#1A1D22" text-anchor="middle">
        <tspan x="0" dy="0">工程验证</tspan>
      </text>
      <text x="0" y="108" font-size="12" fill="#6B7B8D" text-anchor="middle">
        <tspan x="0" dy="0">板弯/热循环</tspan>
      </text>
    </g>
    <g transform="translate(380, 30)">
      <circle cx="0" cy="60" r="6" fill="#C0392B"/>
      <text x="0" y="90" font-size="14" fill="#1A1D22" text-anchor="middle">
        <tspan x="0" dy="0">可靠性验证</tspan>
      </text>
      <text x="0" y="108" font-size="12" fill="#6B7B8D" text-anchor="middle">
        <tspan x="0" dy="0">数千小时</tspan>
      </text>
    </g>
    <g transform="translate(560, 30)">
      <circle cx="0" cy="60" r="6" fill="#C0392B"/>
      <text x="0" y="90" font-size="14" fill="#1A1D22" text-anchor="middle">
        <tspan x="0" dy="0">客户 PPAP</tspan>
      </text>
      <text x="0" y="108" font-size="12" fill="#6B7B8D" text-anchor="middle">
        <tspan x="0" dy="0">数月至年</tspan>
      </text>
    </g>
    <g transform="translate(730, 30)">
      <circle cx="0" cy="60" r="6" fill="#C0392B"/>
      <text x="0" y="90" font-size="14" fill="#1A1D22" text-anchor="middle">
        <tspan x="0" dy="0">量产批准</tspan>
      </text>
      <text x="0" y="108" font-size="12" fill="#6B7B8D" text-anchor="middle">
        <tspan x="0" dy="0">数月至年</tspan>
      </text>
    </g>
    <!-- 锁定图标 -->
    <g transform="translate(900, 30)">
      <rect x="-12" y="48" width="24" height="24" rx="3" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
      <path d="M-6,48 V42 A6,6 0 0,1 6,42 V48" fill="none" stroke="#C0392B" stroke-width="2"/>
      <text x="0" y="98" font-size="15" fill="#C0392B" text-anchor="middle" font-weight="700">
        <tspan x="0" dy="0">锁定</tspan>
      </text>
      <text x="0" y="116" font-size="12" fill="#6B7B8D" text-anchor="middle">
        <tspan x="0" dy="0">~2-3 年总周期</tspan>
      </text>
    </g>

  </g>

  <!-- ============================================================
  06_Key-Insight — 三个关键洞察
  ============================================================ -->
  <g id="Key-Insight" transform="translate(70, 1020)">

    <rect x="0" y="0" width="296" height="145" rx="8" fill="#FFFFFF" fill-opacity="0.8" stroke="#C5CDD4" stroke-width="1"/>
    <circle cx="30" cy="30" r="16" fill="#C0392B"/>
    <text x="30" y="36" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="800">
      <tspan x="30" dy="0">1</tspan>
    </text>
    <text x="60" y="36" font-size="17" font-weight="700" fill="#1A1D22">
      <tspan x="60" dy="0">上游决定天花板</tspan>
    </text>
    <text x="20" y="70" font-size="15" fill="#6B7B8D">
      <tspan x="20" dy="0">高端粉体和浆料由少数日企主导。</tspan>
      <tspan x="20" dy="28">没材料，造不出高端 MLCC。</tspan>
      <tspan x="20" dy="28">国产替代关键在上游。</tspan>
    </text>

    <rect x="322" y="0" width="296" height="145" rx="8" fill="#FFFFFF" fill-opacity="0.8" stroke="#C5CDD4" stroke-width="1"/>
    <circle cx="352" cy="30" r="16" fill="#C0392B"/>
    <text x="352" y="36" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="800">
      <tspan x="352" dy="0">2</tspan>
    </text>
    <text x="382" y="36" font-size="17" font-weight="700" fill="#1A1D22">
      <tspan x="382" dy="0">认证是最大的护城河</tspan>
    </text>
    <text x="342" y="70" font-size="15" fill="#6B7B8D">
      <tspan x="342" dy="0">车规送样到量产 2-3 年。</tspan>
      <tspan x="342" dy="28">一旦通过，客户极少更换。</tspan>
      <tspan x="342" dy="28">新进入者的时间壁垒极高。</tspan>
    </text>

    <rect x="644" y="0" width="296" height="145" rx="8" fill="#FFFFFF" fill-opacity="0.8" stroke="#C5CDD4" stroke-width="1"/>
    <circle cx="674" cy="30" r="16" fill="#1E3A5F"/>
    <text x="674" y="36" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="800">
      <tspan x="674" dy="0">3</tspan>
    </text>
    <text x="704" y="36" font-size="17" font-weight="700" fill="#1A1D22">
      <tspan x="704" dy="0">产能≠供应弹性</tspan>
    </text>
    <text x="664" y="70" font-size="15" fill="#6B7B8D">
      <tspan x="664" dy="0">高端 MLCC 扩张受材料、设备和</tspan>
      <tspan x="664" dy="28">认证周期三重约束。需求涨得快，</tspan>
      <tspan x="664" dy="28">但产能弹性不在高端。</tspan>
    </text>

  </g>

  <!-- ============================================================
  07_Footer
  ============================================================ -->
  <g id="Footer">
    <line x1="70" y1="1322" x2="1010" y2="1322" stroke="#C5CDD4" stroke-width="1.5"/>
    <text x="70" y="1353" font-size="16" font-weight="700" fill="#1E3A5F">
      <tspan x="70" dy="0">ChainFlow 判断</tspan>
    </text>
    <text x="210" y="1353" font-size="16" fill="#1A1D22">
      <tspan x="210" dy="0">对采购来说，第二来源不是名字相似，而是能力匹配+认证对等+供应稳定。</tspan>
    </text>
    <text x="70" y="1385" font-size="13" fill="#6B7B8D">
      <tspan x="70" dy="0">事实来源：MLCC-F012 / F018 / F019。企业信息来自公开资料，不构成投资建议或采购推荐。详细来源见 evidence/source-list-v2.md。</tspan>
    </text>
  </g>

</svg>