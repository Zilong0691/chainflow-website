<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <!--
  ============================================================
  ChainFlow MLCC 001 — 00 封面「多米诺」
  设计日期：2026-06-10

  图层结构（Figma 导入后按此分组）：
  01_Background
  02_Brand-Header
  03_Hero-Illustration（MLCC 多米诺序列，待替换为 A-01 渲染图）
  04_Title-Group
  05_Meta-Info（覆盖范围 + 署名 + 不覆盖声明）
  06_Footer（页脚判断 + 来源）
  ============================================================
  -->
  <defs>
    <!-- 纸张微纹（可选图层，可在 Figma 中调整不透明度） -->
    <filter id="paperTexture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended"/>
    </filter>
    <!-- 标题微影 -->
    <filter id="titleShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    /* 字体回退链 */
    .serif { font-family: 'Songti SC', 'Noto Serif CJK SC', 'STSong', SimSun, serif; }
    .sans { font-family: 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; }
    text { font-family: 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; letter-spacing: 0; }
  </style>

  <!-- ============================================================
  01_Background — 深石墨背景，一本出版物打开的第一页
  ============================================================ -->
  <rect width="1080" height="1440" fill="#1A1D22"/>

  <!-- 微弱几何纹理暗示技术感（可删除图层） -->
  <g opacity="0.03">
    <line x1="0" y1="200" x2="1080" y2="200" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1080" y2="400" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1080" y2="600" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="0" y1="800" x2="1080" y2="800" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="0" y1="1000" x2="1080" y2="1000" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="0" y1="1200" x2="1080" y2="1200" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="0" y1="1400" x2="1080" y2="1400" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="270" y1="0" x2="270" y2="1440" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="540" y1="0" x2="540" y2="1440" stroke="#FFFFFF" stroke-width="0.5"/>
    <line x1="810" y1="0" x2="810" y2="1440" stroke="#FFFFFF" stroke-width="0.5"/>
  </g>

  <!-- 微弱的中央光源暗示 -->
  <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#2A3340" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#1A1D22" stop-opacity="0"/>
  </radialGradient>
  <rect width="1080" height="1440" fill="url(#centerGlow)"/>

  <!-- ============================================================
  02_Brand-Header — 品牌栏（极简介入，不抢视觉）
  ============================================================ -->
  <g id="Brand-Header">
    <line x1="70" y1="92" x2="1010" y2="92" stroke="#C5CDD4" stroke-width="1" opacity="0.4"/>
    <text x="70" y="65" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="500" fill="#8B95A5">
      <tspan x="70" dy="0">链流品类志 / CF Components 001</tspan>
    </text>
    <text x="1010" y="65" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="600" fill="#8B95A5" text-anchor="end">
      <tspan x="1010" dy="0">00 / 09</tspan>
    </text>
  </g>

  <!-- ============================================================
  03_Hero-Illustration — MLCC 多米诺序列
  这里是 SVG 占位示意，正式版替换为图像模型生成的 A-01 渲染图

  三颗 MLCC 从左上到右下倾斜排列：
  - 第一颗（左上）：完整外观 — 陶瓷体 + 两端金属端头
  - 第二颗（中右）：半剖状态 — 左半保留完整，右半剖开展示内部叠层
  - 第三颗（左下）：全剖面 — 完整展示多层交替结构

  倾斜角度约 15°，对角线方向
  ============================================================ -->
  <g id="Hero-Illustration" transform="translate(540, 680)">
    <g transform="rotate(12)">

      <!-- 第一颗：完整外观（左上） -->
      <g transform="translate(-180, -90)">
        <!-- 陶瓷主体 -->
        <rect x="-60" y="-30" width="120" height="60" rx="4" fill="#D4C5A0" opacity="0.9"/>
        <!-- 左端电极 -->
        <rect x="-72" y="-34" width="16" height="68" rx="3" fill="#A8BCC8"/>
        <rect x="-70" y="-32" width="12" height="64" rx="2" fill="#C5D3DE"/>
        <!-- 右端电极 -->
        <rect x="56" y="-34" width="16" height="68" rx="3" fill="#A8BCC8"/>
        <rect x="58" y="-32" width="12" height="64" rx="2" fill="#C5D3DE"/>
        <!-- 外壳微光 -->
        <rect x="-58" y="-28" width="116" height="56" rx="3" fill="#E8DCC0" opacity="0.3"/>
      </g>

      <!-- 第二颗：半剖状态（中右） -->
      <g transform="translate(140, -10)">
        <!-- 陶瓷主体左半 -->
        <rect x="-60" y="-30" width="60" height="60" rx="2" fill="#D4C5A0" opacity="0.9"/>
        <!-- 右半剖面 — 交替叠层 -->
        <rect x="0" y="-30" width="60" height="60" fill="#F4F0E8"/>
        <!-- 介质层（交替色带） -->
        <rect x="0" y="-26" width="60" height="6" fill="#D4C5A0"/>
        <rect x="0" y="-18" width="60" height="2" fill="#1C2E3F"/>
        <rect x="0" y="-14" width="60" height="6" fill="#D4C5A0"/>
        <rect x="0" y="-6" width="60" height="2" fill="#1C2E3F"/>
        <rect x="0" y="-2" width="60" height="6" fill="#D4C5A0"/>
        <rect x="0" y="6" width="60" height="2" fill="#1C2E3F"/>
        <rect x="0" y="10" width="60" height="6" fill="#D4C5A0"/>
        <rect x="0" y="18" width="60" height="2" fill="#1C2E3F"/>
        <rect x="0" y="22" width="60" height="6" fill="#D4C5A0"/>
        <!-- 左端电极 -->
        <rect x="-72" y="-34" width="16" height="68" rx="3" fill="#A8BCC8"/>
        <!-- 右端电极（半剖可见内部连接） -->
        <rect x="56" y="-34" width="16" height="68" rx="3" fill="#A8BCC8"/>
        <!-- 内部电极连线示意 -->
        <line x1="0" y1="-17" x2="56" y2="-17" stroke="#1C2E3F" stroke-width="1.5" opacity="0.7"/>
        <line x1="0" y1="-5" x2="56" y2="-5" stroke="#1C2E3F" stroke-width="1.5" opacity="0.7"/>
        <line x1="0" y1="7" x2="56" y2="7" stroke="#1C2E3F" stroke-width="1.5" opacity="0.7"/>
        <line x1="0" y1="19" x2="56" y2="19" stroke="#1C2E3F" stroke-width="1.5" opacity="0.7"/>
      </g>

      <!-- 第三颗：全剖面展开（左下） -->
      <g transform="translate(-100, 120)">
        <!-- 剖面背景 -->
        <rect x="-60" y="-40" width="120" height="80" fill="#F4F0E8"/>
        <!-- 介质层（13层交替） -->
        <rect x="-60" y="-36" width="120" height="5" fill="#D4C5A0"/>
        <rect x="-52" y="-29" width="104" height="2" fill="#1C2E3F"/>
        <rect x="-60" y="-25" width="120" height="5" fill="#D4C5A0"/>
        <rect x="-52" y="-18" width="104" height="2" fill="#1C2E3F"/>
        <rect x="-60" y="-14" width="120" height="5" fill="#D4C5A0"/>
        <rect x="-52" y="-7" width="104" height="2" fill="#1C2E3F"/>
        <rect x="-60" y="-3" width="120" height="5" fill="#D4C5A0"/>
        <rect x="-52" y="4" width="104" height="2" fill="#1C2E3F"/>
        <rect x="-60" y="8" width="120" height="5" fill="#D4C5A0"/>
        <rect x="-52" y="15" width="104" height="2" fill="#1C2E3F"/>
        <rect x="-60" y="19" width="120" height="5" fill="#D4C5A0"/>
        <rect x="-52" y="26" width="104" height="2" fill="#1C2E3F"/>
        <rect x="-60" y="30" width="120" height="5" fill="#D4C5A0"/>
        <!-- 左端电极（半透展示内部奇偶层分别连接） -->
        <rect x="-72" y="-44" width="16" height="88" rx="3" fill="#B87351" opacity="0.8"/>
        <rect x="-70" y="-42" width="12" height="84" rx="2" fill="#A8BCC8" opacity="0.6"/>
        <!-- 右端电极 -->
        <rect x="56" y="-44" width="16" height="88" rx="3" fill="#B87351" opacity="0.8"/>
        <rect x="58" y="-42" width="12" height="84" rx="2" fill="#A8BCC8" opacity="0.6"/>
        <!-- 奇偶层引出线到端电极 -->
        <line x1="-60" y1="-28" x2="-72" y2="-28" stroke="#1C2E3F" stroke-width="1.5"/>
        <line x1="-60" y1="-6" x2="-72" y2="-6" stroke="#1C2E3F" stroke-width="1.5"/>
        <line x1="-60" y1="16" x2="-72" y2="16" stroke="#1C2E3F" stroke-width="1.5"/>
        <line x1="60" y1="-17" x2="72" y2="-17" stroke="#1C2E3F" stroke-width="1.5"/>
        <line x1="60" y1="5" x2="72" y2="5" stroke="#1C2E3F" stroke-width="1.5"/>
        <line x1="60" y1="27" x2="72" y2="27" stroke="#1C2E3F" stroke-width="1.5"/>
      </g>

    </g>

    <!-- 多米诺的连接暗示——微弱的虚线从第一颗到第三颗 -->
    <line x1="-120" y1="-60" x2="160" y2="30" stroke="#C5CDD4" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.3"/>
    <line x1="160" y1="30" x2="-40" y2="160" stroke="#C5CDD4" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.3"/>

  </g>

  <!-- ============================================================
  04_Title-Group — 主标题，叠加在主视觉上方
  ============================================================ -->
  <g id="Title-Group" filter="url(#titleShadow)">
    <!-- 主标题 -->
    <text x="540" y="440" font-family="'Songti SC','Noto Serif CJK SC','STSong',SimSun,serif" font-size="76" font-weight="700" fill="#F4F0E8" text-anchor="middle" letter-spacing="4">
      <tspan x="540" dy="0">被低估的微小器件</tspan>
    </text>

    <!-- 副标题 -->
    <text x="540" y="502" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="26" font-weight="400" fill="#A0AAB5" text-anchor="middle" letter-spacing="2">
      <tspan x="540" dy="0">MLCC · 多层片式陶瓷电容器</tspan>
    </text>
  </g>

  <!-- ============================================================
  05_Meta-Info — 覆盖范围、署名、不覆盖声明
  ============================================================ -->
  <g id="Meta-Info">
    <!-- 本期覆盖范围 -->
    <rect x="180" y="1070" width="720" height="56" rx="6" fill="#FFFFFF" opacity="0.08" stroke="#C5CDD4" stroke-width="1" stroke-opacity="0.2"/>
    <text x="540" y="1104" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="18" fill="#A0AAB5" text-anchor="middle">
      <tspan x="540" dy="0">本期覆盖：结构 · 参数 · 材料 · 工艺 · 产业链 · 竞争格局 · 替代风险</tspan>
    </text>

    <!-- 不覆盖声明 -->
    <text x="540" y="1146" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" fill="#C0392B" text-anchor="middle" opacity="0.8">
      <tspan x="540" dy="0">不输出投资建议 · 不使用未经核验的市场份额与单机用量数字</tspan>
    </text>

    <!-- 署名 -->
    <text x="540" y="1200" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="500" fill="#8B95A5" text-anchor="middle">
      <tspan x="540" dy="0">赵子龙 ｜ 链流 ChainFlow 发起人</tspan>
    </text>
  </g>

  <!-- ============================================================
  06_Footer — 页脚判断 + 来源
  ============================================================ -->
  <g id="Footer">
    <line x1="70" y1="1322" x2="1010" y2="1322" stroke="#C5CDD4" stroke-width="1" opacity="0.3"/>
    <text x="70" y="1353" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="700" fill="#F4F0E8">
      <tspan x="70" dy="0">ChainFlow 判断</tspan>
    </text>
    <text x="210" y="1353" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="15" fill="#8B95A5">
      <tspan x="210" dy="0">小器件，大系统风险。真正的壁垒，藏在材料、工艺与验证的乘数关系里。</tspan>
    </text>
    <text x="70" y="1385" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#6B7B8D">
      <tspan x="70" dy="0">来源说明：本页为研究定位页，不含定量数据。全部来源见本期 evidence 目录。</tspan>
    </text>
  </g>

</svg>