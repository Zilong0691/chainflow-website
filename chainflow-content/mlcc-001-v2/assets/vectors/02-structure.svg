<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <!--
  ============================================================
  ChainFlow MLCC 001 — 02 技术解剖「Zoom In 连续剖面」
  设计日期：2026-06-10

  图层结构（Figma 导入后按此分组）：
  01_Background
  02_Brand-Header
  03_Title-Group
  04_Zoom-Sequence（三级连续放大剖面）
  05_Annotations（标注线 + 标注文本）
  06_Logic-Box（结构逻辑说明 + 等效公式）
  07_Footer
  ============================================================
  -->

  <style>
    .serif { font-family: 'Songti SC', 'Noto Serif CJK SC', 'STSong', SimSun, serif; }
    .sans { font-family: 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; }
    text { font-family: 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; letter-spacing: 0; }
  </style>

  <!-- ============================================================
  01_Background — 纸白背景
  ============================================================ -->
  <rect width="1080" height="1440" fill="#F4F0E8"/>

  <!-- ============================================================
  02_Brand-Header
  ============================================================ -->
  <g id="Brand-Header">
    <line x1="70" y1="92" x2="1010" y2="92" stroke="#C5CDD4" stroke-width="1.5"/>
    <text x="70" y="65" font-size="15" font-weight="600" fill="#1E3A5F">
      <tspan x="70" dy="0">链流品类志 / CF Components 001</tspan>
    </text>
    <text x="1010" y="65" font-size="15" font-weight="700" fill="#1E3A5F" text-anchor="end">
      <tspan x="1010" dy="0">02 / 09</tspan>
    </text>
  </g>

  <!-- ============================================================
  03_Title-Group
  ============================================================ -->
  <g id="Title-Group">
    <text x="70" y="170" font-family="'Songti SC','Noto Serif CJK SC','STSong',SimSun,serif" font-size="58" font-weight="700" fill="#1A1D22" letter-spacing="2">
      <tspan x="70" dy="0">一颗MLCC内部，是上百个电容并联</tspan>
    </text>
    <text x="72" y="220" font-size="24" font-weight="500" fill="#6B7B8D">
      <tspan x="72" dy="0">陶瓷介质层与镍内电极交替堆叠，奇偶层分别连接左右端头——每个夹层都是独立电容单元</tspan>
    </text>
  </g>

  <!-- ============================================================
  04_Zoom-Sequence — 三级连续放大
  从上到下：整颗器件 → 局部叠层 → 单层细节
  ============================================================ -->
  <g id="Zoom-Sequence">

    <!-- ====== 级别1：整颗器件外观（顶部） ====== -->
    <g transform="translate(540, 340)">
      <!-- 器件轮廓线框 -->
      <rect x="-180" y="-43" width="360" height="86" rx="6" fill="#FFFFFF" fill-opacity="0.5" stroke="#C5CDD4" stroke-width="1.5"/>

      <!-- 陶瓷主体 -->
      <rect x="-140" y="-36" width="280" height="72" rx="4" fill="#D4C5A0"/>
      <!-- 表面细微质感 -->
      <rect x="-138" y="-34" width="276" height="68" rx="3" fill="#E8DCC0" opacity="0.4"/>

      <!-- 左端电极 -->
      <rect x="-185" y="-46" width="50" height="92" rx="6" fill="#A8BCC8"/>
      <rect x="-183" y="-44" width="46" height="88" rx="5" fill="#C5D3DE"/>
      <!-- 镀层分层提示 -->
      <rect x="-183" y="-44" width="6" height="88" fill="#B87351" opacity="0.5" rx="2"/>

      <!-- 右端电极 -->
      <rect x="135" y="-46" width="50" height="92" rx="6" fill="#A8BCC8"/>
      <rect x="137" y="-44" width="46" height="88" rx="5" fill="#C5D3DE"/>
      <rect x="177" y="-44" width="6" height="88" fill="#B87351" opacity="0.5" rx="2"/>

      <!-- 级别标签 -->
      <text x="210" y="-56" font-size="17" font-weight="700" fill="#1E3A5F">
        <tspan x="230" dy="0">▲ 0402 封装（1.0 × 0.5 mm）</tspan>
      </text>
      <text x="210" y="-36" font-size="14" fill="#6B7B8D">
        <tspan x="230" dy="0">人眼可见的最小贴片元件之一</tspan>
      </text>

      <!-- Zoom In 指示箭头 -->
      <path d="M 0 54 L 0 72" stroke="#2C6280" stroke-width="2" marker-end="url(#zoomArrow)"/>
    </g>

    <!-- Zoom 箭头标记 -->
    <defs>
      <marker id="zoomArrow" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
        <path d="M0,0 L5,8 L10,0" fill="none" stroke="#2C6280" stroke-width="2"/>
      </marker>
    </defs>

    <!-- ====== 级别2：局部叠层剖面（中部） ====== -->
    <g transform="translate(540, 560)">
      <!-- 外框 -->
      <rect x="-280" y="-58" width="560" height="116" rx="8" fill="#FFFFFF" fill-opacity="0.7" stroke="#C5CDD4" stroke-width="1.5"/>

      <!-- 叠层剖面 — 展示5对介质+电极 -->
      <g transform="translate(-240, -50)">
        <!-- 左端电极部分 -->
        <rect x="-35" y="-4" width="40" height="108" rx="4" fill="#B87351" opacity="0.7"/>
        <rect x="-30" y="-2" width="30" height="104" rx="3" fill="#A8BCC8" opacity="0.8"/>

        <!-- 右端电极部分 -->
        <rect x="465" y="-4" width="40" height="108" rx="4" fill="#B87351" opacity="0.7"/>
        <rect x="470" y="-2" width="30" height="104" rx="3" fill="#A8BCC8" opacity="0.8"/>

        <!-- 介质层 (5层陶瓷，各18px高) -->
        <rect x="5" y="0" width="460" height="18" fill="#D4C5A0" rx="1"/>
        <rect x="5" y="20" width="460" height="18" fill="#E8DCC0" rx="1"/>
        <rect x="5" y="40" width="460" height="18" fill="#D4C5A0" rx="1"/>
        <rect x="5" y="60" width="460" height="18" fill="#E8DCC0" rx="1"/>
        <rect x="5" y="80" width="460" height="18" fill="#D4C5A0" rx="1"/>

        <!-- 内电极 (4层镍，各6px高，奇偶交替连接左右) -->
        <!-- 奇数层→左端 -->
        <rect x="8" y="18" width="460" height="6" fill="#1C2E3F" rx="1"/>
        <path d="M8 21 L-30 21" stroke="#1C2E3F" stroke-width="2"/>
        <!-- 偶数层→右端 -->
        <rect x="3" y="38" width="462" height="6" fill="#1C2E3F" rx="1"/>
        <path d="M468 41 L495 41" stroke="#1C2E3F" stroke-width="2"/>
        <!-- 奇数层→左端 -->
        <rect x="8" y="58" width="460" height="6" fill="#1C2E3F" rx="1"/>
        <path d="M8 61 L-30 61" stroke="#1C2E3F" stroke-width="2"/>
        <!-- 偶数层→右端 -->
        <rect x="3" y="78" width="462" height="6" fill="#1C2E3F" rx="1"/>
        <path d="M468 81 L495 81" stroke="#1C2E3F" stroke-width="2"/>

        <!-- 奇偶层连接标注 -->
        <text x="-210" y="25" font-size="13" fill="#1E3A5F" font-weight="600">
          <tspan x="-200" dy="0">奇数层 → 左端</tspan>
        </text>
        <text x="-210" y="85" font-size="13" fill="#1E3A5F" font-weight="600">
          <tspan x="-200" dy="0">奇数层 → 左端</tspan>
        </text>
        <text x="500" y="45" font-size="13" fill="#1E3A5F" font-weight="600">
          <tspan x="505" dy="0">← 偶数层右端</tspan>
        </text>
        <text x="500" y="85" font-size="13" fill="#1E3A5F" font-weight="600">
          <tspan x="505" dy="0">← 偶数层右端</tspan>
        </text>

        <!-- 介质层标注 -->
        <text x="130" y="-14" font-size="14" fill="#6B7B8D">
          <tspan x="130" dy="0">陶瓷介质层（BaTiO₃ 基陶瓷）</tspan>
        </text>
        <line x1="130" y1="-10" x2="130" y2="5" stroke="#2C6280" stroke-width="1.5"/>
        <circle cx="130" cy="5" r="4" fill="#1E3A5F"/>

        <!-- 内电极标注 -->
        <text x="300" y="14" font-size="14" fill="#6B7B8D">
          <tspan x="300" dy="0">镍内电极（Ni，BME 体系）</tspan>
        </text>
        <line x1="320" y1="18" x2="270" y2="21" stroke="#2C6280" stroke-width="1.5"/>
        <circle cx="270" cy="21" r="4" fill="#1E3A5F"/>
      </g>

      <!-- 级别标签 -->
      <text x="220" y="-72" font-size="17" font-weight="700" fill="#1E3A5F">
        <tspan x="240" dy="0">▼ 局部放大：5层介质 + 4层内电极</tspan>
      </text>
      <text x="220" y="-52" font-size="14" fill="#6B7B8D">
        <tspan x="240" dy="0">奇偶层内电极分别延伸到左右端头，形成并联结构</tspan>
      </text>

      <!-- Zoom In 继续 -->
      <path d="M 0 68 L 0 88" stroke="#2C6280" stroke-width="2" marker-end="url(#zoomArrow)"/>
    </g>

    <!-- ====== 级别3：单层微观细节（底部） ====== -->
    <g transform="translate(540, 810)">
      <rect x="-260" y="-48" width="520" height="96" rx="8" fill="#FFFFFF" fill-opacity="0.7" stroke="#C5CDD4" stroke-width="1.5"/>

      <g transform="translate(-220, -40)">
        <!-- 单层介质 -->
        <rect x="10" y="10" width="420" height="30" fill="#D4C5A0" rx="2"/>

        <!-- 上电极（连接左端） -->
        <rect x="15" y="4" width="410" height="6" fill="#1C2E3F" rx="1"/>
        <path d="M15 7 L-15 7" stroke="#1C2E3F" stroke-width="2"/>

        <!-- 下电极（连接右端） -->
        <rect x="10" y="40" width="415" height="6" fill="#1C2E3F" rx="1"/>
        <path d="M430 43 L455 43" stroke="#1C2E3F" stroke-width="2"/>

        <!-- 电场方向示意 -->
        <path d="M100 15 L100 35" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#eArrow)"/>
        <path d="M200 15 L200 35" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#eArrow)"/>
        <path d="M300 15 L300 35" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#eArrow)"/>

        <!-- 电极面积 A 标注 -->
        <text x="200" y="-8" font-size="14" fill="#1E3A5F" text-anchor="middle">
          <tspan x="200" dy="0">电极有效面积 A</tspan>
        </text>
        <line x1="60" y1="-4" x2="60" y2="7" stroke="#2C6280" stroke-width="1"/>
        <line x1="380" y1="-4" x2="380" y2="7" stroke="#2C6280" stroke-width="1"/>

        <!-- 介质厚度 d 标注 -->
        <text x="-50" y="30" font-size="14" fill="#1E3A5F">
          <tspan x="-50" dy="0">介质厚度 d</tspan>
        </text>
        <line x1="-20" y1="15" x2="5" y2="25" stroke="#2C6280" stroke-width="1"/>
        <line x1="-20" y1="45" x2="5" y2="25" stroke="#2C6280" stroke-width="1"/>

        <!-- 介电常数标注 -->
        <text x="200" y="72" font-size="14" fill="#1E3A5F" text-anchor="middle">
          <tspan x="200" dy="0">介电常数 εᵣ（材料特性）</tspan>
        </text>
        <line x1="200" y1="68" x2="200" y2="44" stroke="#2C6280" stroke-width="1"/>
        <circle cx="200" cy="44" r="4" fill="#1E3A5F"/>
      </g>

      <!-- 级别标签 -->
      <text x="220" y="-62" font-size="17" font-weight="700" fill="#1E3A5F">
        <tspan x="240" dy="0">▼ 单层等效电容单元</tspan>
      </text>
      <text x="220" y="-42" font-size="14" fill="#6B7B8D">
        <tspan x="240" dy="0">C 单层 = εᵣ × ε₀ × A / d</tspan>
      </text>
    </g>

    <!-- 电场箭头 -->
    <defs>
      <marker id="eArrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
        <path d="M0,0 L3,3 L0,6" fill="none" stroke="#C0392B" stroke-width="1"/>
      </marker>
    </defs>

  </g>

  <!-- ============================================================
  06_Logic-Box — 结构逻辑说明 + 等效公式
  ============================================================ -->
  <g id="Logic-Box" transform="translate(70, 960)">
    <rect x="0" y="0" width="940" height="200" rx="8" fill="#FFFFFF" fill-opacity="0.75" stroke="#C5CDD4" stroke-width="1.5"/>

    <!-- 左栏：文字说明 -->
    <text x="30" y="40" font-size="20" font-weight="700" fill="#1E3A5F">
      <tspan x="30" dy="0">结构逻辑</tspan>
    </text>
    <text x="30" y="80" font-size="20" fill="#1A1D22">
      <tspan x="30" dy="0">每两层相邻内电极之间形成一个独立的电容单元。</tspan>
    </text>
    <text x="30" y="115" font-size="20" fill="#1A1D22">
      <tspan x="30" dy="0">奇偶层内电极通过左右端头分别引出 → 所有单元等效并联。</tspan>
    </text>
    <text x="30" y="150" font-size="20" fill="#1A1D22">
      <tspan x="30" dy="0">总容量随有效面积、介电常数和叠层数增加而增大。</tspan>
    </text>

    <!-- 右栏：公式框 -->
    <rect x="610" y="35" width="300" height="130" rx="6" fill="#1E3A5F"/>
    <text x="760" y="75" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="600">
      <tspan x="760" dy="0">等效并联公式</tspan>
    </text>
    <text x="760" y="115" font-size="22" fill="#F4F0E8" text-anchor="middle" font-weight="700">
      <tspan x="760" dy="0">C_total ≈ n × εᵣ ε₀ A / d</tspan>
    </text>
    <text x="760" y="148" font-size="14" fill="#A8BCC8" text-anchor="middle">
      <tspan x="760" dy="0">n = 叠层数量 n ↑ → C_total ↑</tspan>
    </text>
  </g>

  <!-- ============================================================
  07_Footer
  ============================================================ -->
  <g id="Footer">
    <line x1="70" y1="1322" x2="1010" y2="1322" stroke="#C5CDD4" stroke-width="1.5"/>
    <text x="70" y="1353" font-size="16" font-weight="700" fill="#1E3A5F">
      <tspan x="70" dy="0">ChainFlow 判断</tspan>
    </text>
    <text x="210" y="1353" font-size="16" fill="#1A1D22">
      <tspan x="210" dy="0">看懂端头连接，才看得懂为什么同样封装也会有不同性能边界。</tspan>
    </text>
    <text x="70" y="1385" font-size="13" fill="#6B7B8D">
      <tspan x="70" dy="0">事实来源：MLCC-F001/F002/F009。结构为通用技术示意，非特定厂商型号。详细来源见 evidence/source-list-v2.md。</tspan>
    </text>
  </g>

</svg>